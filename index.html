<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--muted:#5d6676;--line:#e3e6ec;--accent:#0b7a75;--accent-ink:#fff;--accent-soft:#e3f3f2;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#161b22;--ink:#e6eaf0;--muted:#97a1b0;--line:#262d38;--accent:#2bb3ac;--accent-ink:#06201f;--accent-soft:#12302f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Noto Sans Arabic',system-ui,sans-serif}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{width:42px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
header b{display:block;font-size:16px}header small{color:var(--muted);font-size:12px}
.back{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{flex:1;min-width:0;font:600 14px Inter,sans-serif;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);font:600 14px Inter,'Noto Sans Arabic',sans-serif;padding:9px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vid{position:relative;aspect-ratio:16/9;background:#000}
.vid iframe,.vid #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.blocked{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px;background:radial-gradient(circle at 30% 20%,#23415a,#0d141c 70%)}
.meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.meta h1{font-size:17px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.list{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:14px;min-width:0}
.li.cur{border-color:var(--accent);background:var(--accent-soft)}
.li .id{color:var(--muted);font-size:12px;width:28px;flex:none}
.li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ck{font-size:12px;color:var(--accent);flex:none;font-weight:700}
.pl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 0}
</style>
</head>

<script>
const L=JSON.parse(document.getElementById('data').textContent);
const byId=Object.fromEntries(L.map(l=>[l.id,l]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let W={}; try{W=JSON.parse(localStorage.getItem('ccna-vid-watched')||'{}')}catch(e){}
function saveW(){try{localStorage.setItem('ccna-vid-watched',JSON.stringify(W))}catch(e){}}
let lang='en'; try{lang=localStorage.getItem('ccna-vid-lang')||'en'}catch(e){}
let cur=L[0].id;
function fmtN(n){ if(n==null) return ''; const f=(x,u)=>(x>=100?Math.round(x):x.toFixed(1).replace(/\.0$/,''))+u; return n>=1e6?f(n/1e6,'M'):n>=1e3?f(n/1e3,'K'):String(n); }
function fmtDur(p){ const m=/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(p||''); if(!m) return ''; const h=+m[1]||0,mi=+m[2]||0,s=+m[3]||0,z=x=>String(x).padStart(2,'0'); return h?`${h}:${z(mi)}:${z(s)}`:`${mi}:${z(s)}`; }
const key=(id,lg)=>id+'-'+lg;

function parseHash(){
  const m=/^#(L\d{1,2})(?:-(en|ar))?$/.exec(location.hash);
  if(m && byId[m[1]]){ cur=m[1]; if(m[2]) lang=m[2]; }
}
// YouTube player
let yt=null, ytReady=false, pendingId=null;
window.onYouTubeIframeAPIReady=()=>{ ytReady=true; if(pendingId) loadVideo(pendingId); };
function loadVideo(id){
  if(!ytReady){ pendingId=id; return; }
  const box=document.querySelector('.vid'); const bl=box.querySelector('.blocked'); if(bl) bl.remove();
  if(yt){ yt.cueVideoById({videoId:id,startSeconds:resumeAt(id)}); return; }
  yt=new YT.Player('player',{videoId:id,
    playerVars:{rel:0,playsinline:1,modestbranding:1,start:resumeAt(id)},
    events:{onError:e=>showBlocked(e.data), onStateChange:e=>{ if(e.data===0){ delete POS[byId[cur][lang].id]; savePos(); markWatched(true); } }}});
}
let POS={}; try{POS=JSON.parse(localStorage.getItem('ccna-vid-pos')||'{}')}catch(e){}
function savePos(){try{localStorage.setItem('ccna-vid-pos',JSON.stringify(POS))}catch(e){}}
function resumeAt(id){ return Math.max(0,(POS[id]||0)-3); }
setInterval(()=>{ try{ if(yt&&yt.getPlayerState&&yt.getPlayerState()===1){ const t=Math.floor(yt.getCurrentTime()), d=yt.getDuration(); const vid=byId[cur][lang].id; if(d&&t>d-20) delete POS[vid]; else POS[vid]=t; savePos(); } }catch(e){} },5000);
function showBlocked(code){
  const v=byId[cur][lang];
  const d=document.createElement('div'); d.className='blocked';
  d.innerHTML=`<div><p style="margin:0 0 12px">${code===101||code===150?'The uploader doesn\'t allow this video to play outside YouTube.':'This video couldn\'t load here.'}</p>
    <a class="btn primary" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener">▶ Watch on YouTube</a></div>`;
  document.querySelector('.vid').appendChild(d);
}
function markWatched(val){ W[key(cur,lang)]=val; saveW(); renderMeta(); renderList(); }
function renderMeta(){
  const l=byId[cur], v=l[lang], w=!!W[key(cur,lang)];
  const stats=v.v!=null?`${fmtN(v.v)} views · ${fmtN(v.lk)} likes`:'Top YouTube match for this topic';
  $('#meta').innerHTML=`<div><span class="chip">${l.id}</span> <span class="note">${esc(l.title)}</span></div>
   <h1 dir="auto">${esc(v.t)}</h1>
   <div class="note">${v.ch?esc(v.ch)+' · ':''}${v.d?fmtDur(v.d)+' · ':''}${stats}</div>
   <div class="acts"><button class="btn ${w?'':'primary'}" id="wbtn">${w?'✓ Watched':'Mark as watched'}</button>
   <a class="btn" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener">Open on YouTube</a></div>`;
  $('#wbtn').onclick=()=>markWatched(!w);
}
function renderList(){
  $('#list').innerHTML=L.map(l=>{ const e=W[key(l.id,'en')], a=W[key(l.id,'ar')];
    return `<a class="li ${l.id===cur?'cur':''}" href="#${l.id}-${lang}"><span class="id">${l.id}</span><span class="t">${esc(l.title)}</span><span class="ck">${e?'EN✓':''} ${a?'AR✓':''}</span></a>`; }).join('');
}
function render(){
  try{localStorage.setItem('ccna-vid-lang',lang)}catch(e){}
  $('#sel').value=cur;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  $('#back').href='https://claude.ai/artifact/M3YmCnrVRjbzYrfkhNYKfb#'+cur;
  const i=L.findIndex(l=>l.id===cur); $('#prev').disabled=i===0; $('#next').disabled=i===L.length-1;
  renderMeta(); renderList(); loadVideo(byId[cur][lang].id);
  document.title=`${cur} – CCNA Coach Videos`;
}
function go(id,lg){ const h='#'+id+'-'+(lg||lang); if(location.hash!==h) location.hash=h; else { parseHash(); render(); } }
$('#sel').innerHTML=L.map(l=>`<option value="${l.id}">${l.id} · ${esc(l.title)}</option>`).join('');
$('#sel').onchange=e=>go(e.target.value);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>go(cur,b.dataset.lang));
$('#prev').onclick=()=>{ const i=L.findIndex(l=>l.id===cur); if(i>0) go(L[i-1].id); };
$('#next').onclick=()=>{ const i=L.findIndex(l=>l.id===cur); if(i<L.length-1) go(L[i+1].id); };
addEventListener('hashchange',()=>{ parseHash(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
const plUrl=k=>'https://www.youtube.com/watch_videos?video_ids='+L.map(l=>l[k].id).join(',');
$('#plEn').href=plUrl('en'); $('#plAr').href=plUrl('ar');
parseHash(); render();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
